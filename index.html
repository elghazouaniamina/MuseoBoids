<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseoBoids - Interactive 3D Museum Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
        }
        #controls h3 {
            margin-top: 0;
        }
        .control-group {
            margin: 10px 0;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
        }
        button {
            margin: 5px 5px 5px 0;
            padding: 5px 10px;
            cursor: pointer;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="controls">
        <h3>MuseoBoids Controls</h3>
        <div class="control-group">
            <button id="toggleGuide">Toggle Guide</button>
            <button id="toggleCameraAsBoid">Toggle Camera-as-Boid</button>
        </div>
        <div class="control-group">
            <label>Visitor Count: <span id="visitorCount">20</span></label>
            <input type="range" id="visitorCountSlider" min="5" max="50" value="20">
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="showTrajectory" checked> Show Guide Trajectory
            </label>
        </div>
        <div class="control-group">
            <p style="font-size: 11px; margin: 5px 0;">
                <strong>Controls:</strong><br>
                Mouse: Look around<br>
                WASD: Move camera<br>
                Space: Up / Shift: Down
            </p>
        </div>
    </div>
    <div id="info">
        FPS: <span id="fps">0</span> | Visitors: <span id="visitorCountDisplay">20</span>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
